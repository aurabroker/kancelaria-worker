name = 'kancelaria-worker'
main = "src/worker.js"
compatibility_date = "2024-09-23"
[observability]
# Logi wlaczone 15 wrzesnia 2026: bez nich awaria zapisu do bazy byla
# niewidoczna, a formularz zwracal tylko goly kod 500.
[observability.logs]
enabled = true
invocation_logs = true

# Powiazanie z magazynem sekretow Cloudflare. MUSI byc zadeklarowane w tym
# pliku — wrangler wysyla przy wgrywaniu wersji dokladnie te bindingi, ktore
# tu widzi, wiec brak wpisu oznacza ciche wygaszenie wysylki poczty.
# Wartosci odczytane z wersji wdrozonej 8 wrzesnia 2026.
[[secrets_store_secrets]]
binding     = "RESEND_API_KEY"
store_id    = "15030d8ca051490e96bd866168384aa9"
secret_name = "RESEND_API_KEY"

# To samo dotyczy klucza Turnstile: brak wpisu oznacza, ze nastepne
# wgranie wersji zdejmie powiazanie, a formularz przestanie sprawdzac,
# czy wypelnia go czlowiek.
[[secrets_store_secrets]]
binding     = "TURNSTILE_SECRET"
store_id    = "15030d8ca051490e96bd866168384aa9"
secret_name = "TURNSTILE_SECRET"

# Drugi widget Turnstile: limit dziesieciu nazw hosta na widget zmusil
# do rozbicia jedenastu domen na dwa widgety, kazdy z wlasnym sekretem.
[[secrets_store_secrets]]
binding     = "TURNSTILE_SECRET_2"
store_id    = "15030d8ca051490e96bd866168384aa9"
secret_name = "TURNSTILE_SECRET_2"

# Markdown dla agentow, wlaczony 17 wrzesnia 2026 na polecenie wlasciciela.
# Zmienna MUSI stac tutaj, a nie w panelu: wrangler wysyla przy wgrywaniu
# wersji dokladnie te ustawienia, ktore widzi w tym pliku, wiec wpis dodany
# recznie w panelu zniknalby przy najblizszym wdrozeniu.
# Wartosc "nie" wylacza z powrotem, bez zmiany kodu.
[vars]
MARKDOWN_DLA_AGENTOW = "tak"
